services:
  - type: web
    name: urban-water-logged-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:8080,http://localhost:5173"
      - key: SECRET_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
