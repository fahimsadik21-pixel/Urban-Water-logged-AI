[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-waterlogged-ai"
version = "1.0.0"
description = "City-adaptive, uncertainty-aware urban waterlogging detection, response-prioritization and smart-dewatering SaaS"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Urban Water-logged AI Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.30",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "httpx>=0.27.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
